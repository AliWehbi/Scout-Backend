# Local development only: a Postgres to run the app against instead of SQLite.
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://scout:scout@localhost:5432/scout   (in .env)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
