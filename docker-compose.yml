# Production stack. GitHub Actions copies this file and nginx/ to ~/scout-backend on the
# server on every release; the server keeps its own .env next to it (see DEPLOY.md).
#
#   host nginx (TLS, api domain) -> 127.0.0.1:8001 -> nginx container -> backend (gunicorn)
#                                                     /static, /media served from volumes
name: scout

services:
  db:
    image: postgres:16-alpine
    container_name: scout_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports: only the backend container can reach the database.

  backend:
    image: ghcr.io/aliwehbi/scout-backend:${IMAGE_TAG:-latest}
    container_name: scout_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Uploaded document templates: backend only, never mounted into nginx.
      - private_volume:/app/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: scout_nginx
    restart: unless-stopped
    ports:
      # Localhost only: the host nginx proxies the public domain to this port.
      - "127.0.0.1:${SCOUT_HTTP_PORT:-8001}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  static_volume:
  media_volume:
  private_volume:
