events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Resolve "backend" through Docker's DNS at request time rather than once at startup:
    # each deploy recreates the backend container with a new IP, and a static upstream
    # would keep proxying to the old one (502s) until nginx itself restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The host nginx in front terminates TLS and forwards X-Forwarded-Proto; pass it on so
    # Django knows the original request was https.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # Member photos, logos and spreadsheet imports
        client_max_body_size 25M;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            # A variable forces per-request DNS lookups via the resolver above.
            set $django backend:8000;
            proxy_pass http://$django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
