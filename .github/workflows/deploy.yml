name: Build and Deploy

# Release:   git tag v1.0.0 && git push origin v1.0.0
# Redeploy or roll back an existing tag: Actions tab -> Build and Deploy -> Run workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.0.0)'
        required: true

env:
  IMAGE_NAME: ghcr.io/aliwehbi/scout-backend
  TAG: ${{ inputs.tag || github.ref_name }}

# Never run two deploys at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scout
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://scout:scout@localhost:5432/scout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (on Postgres)
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The server only needs the compose file and the nginx config of this release
      # (plus its own .env); the code ships inside the image.
      - name: Copy compose and nginx config to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.yml,nginx/nginx.conf
          target: scout-backend

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/scout-backend
            if [ ! -f .env ]; then
              echo "~/scout-backend/.env is missing on the server - see DEPLOY.md" >&2
              exit 1
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export IMAGE_TAG=${{ env.TAG }}
            docker compose pull backend
            docker compose up -d
            # nginx is not recreated when only the backend changes; restart it so it
            # picks up this release's nginx.conf (copied above).
            docker compose restart nginx
            echo "${{ env.TAG }}" > .release

            # Wait for the new version to answer through the stack's nginx.
            PORT=$(grep -E '^SCOUT_HTTP_PORT=' .env | cut -d= -f2)
            PORT=${PORT:-8001}
            for i in $(seq 1 30); do
              if curl -fs "http://127.0.0.1:${PORT}/api/health/" > /dev/null; then
                echo "Deployed ${{ env.TAG }}: healthy"
                break
              fi
              if [ "$i" = 30 ]; then
                echo "Backend did not become healthy:" >&2
                docker compose logs --tail 80 backend >&2
                exit 1
              fi
              sleep 4
            done

            docker logout ghcr.io

            # Keep the 2 most recent release images for rollbacks.
            KEEP=2
            docker images "${{ env.IMAGE_NAME }}" --format '{{.Tag}}' \
              | grep -v '^latest$' \
              | tail -n +$((KEEP+1)) \
              | xargs -r -I {} docker rmi "${{ env.IMAGE_NAME }}:{}" || true
            docker image prune -f
